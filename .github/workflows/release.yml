name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  RELEASE_PACKAGES: Toro Toro.NN Toro.GNN Toro.Text Toro.Vision

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.fsproj
            .config/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet fantomas --check src/ tests/ examples/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.fsproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Compute package version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack packages
        run: |
          version=${{ steps.version.outputs.version }}
          IFS=' ' read -r -a packages <<< "$RELEASE_PACKAGES"
          for pkg in "${packages[@]}"; do
            dotnet pack "src/$pkg/$pkg.fsproj" \
              --configuration Release \
              --no-build \
              --output artifacts \
              "/p:Version=$version"
          done

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [format, test]
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compute package version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Toro may already be published for this version; skip duplicates.
      - name: NuGet push packages
        run: |
          version=${{ steps.version.outputs.version }}
          IFS=' ' read -r -a packages <<< "$RELEASE_PACKAGES"
          for pkg in "${packages[@]}"; do
            dotnet nuget push "artifacts/$pkg.$version.nupkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
