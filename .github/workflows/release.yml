name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet fantomas --check src/ tests/ examples/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  publish:
    needs: [format, test]
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Compute package version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack Toro
        run: dotnet pack src/Toro/Toro.fsproj --configuration Release --no-build --output artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Toro.NN
        run: dotnet pack src/Toro.NN/Toro.NN.fsproj --configuration Release --no-build --output artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Toro.GNN
        run: dotnet pack src/Toro.GNN/Toro.GNN.fsproj --configuration Release --no-build --output artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Toro.Text
        run: dotnet pack src/Toro.Text/Toro.Text.fsproj --configuration Release --no-build --output artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Toro.Vision
        run: dotnet pack src/Toro.Vision/Toro.Vision.fsproj --configuration Release --no-build --output artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Toro may already be published for this version; skip duplicates.
      - name: NuGet push Toro
        run: >
          dotnet nuget push artifacts/Toro.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: NuGet push Toro.NN
        run: >
          dotnet nuget push
          artifacts/Toro.NN.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: NuGet push Toro.GNN
        run: >
          dotnet nuget push
          artifacts/Toro.GNN.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: NuGet push Toro.Text
        run: >
          dotnet nuget push
          artifacts/Toro.Text.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: NuGet push Toro.Vision
        run: >
          dotnet nuget push
          artifacts/Toro.Vision.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
