name: docs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download dotnet build from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.fsproj
            .config/dotnet-tools.json

      - name: Build library
        if: github.event_name == 'workflow_dispatch'
        run: dotnet build -c Release

      - name: Restore tools
        run: dotnet tool restore

      - name: Generate API docs (FSDocs)
        run: dotnet fsi scripts/generate-api-docs.fsx

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Generate API MDX
        run: node scripts/generate-api-mdx.mts

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm build

      - name: Prepare deploy
        working-directory: docs/build/client
        run: |
          cp -r assets toro/
          cp -r img toro/
          cp __spa-fallback.html toro/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/client/toro

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
